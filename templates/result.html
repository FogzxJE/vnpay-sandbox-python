<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả thanh toán đơn hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .receipt-card { border-radius: 16px; border: none; overflow: hidden; background: #fff; }
    .status-icon {
      width: 72px; height: 72px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 12px;
    }
  </style>
</head>
<body class="py-5">
  <div class="container" style="max-width: 580px;">
    <div class="receipt-card shadow-sm">
      
      <!-- Banner Trạng Thái -->
      <div id="statusBanner" class="p-4 text-center text-white bg-secondary">
        <div id="statusIconWrap" class="status-icon bg-white bg-opacity-25">
          <i id="statusIcon" class="fa-solid fa-circle-notch fa-spin"></i>
        </div>
        <h4 id="statusTitle" class="fw-bold mb-1">Đang xử lý giao dịch</h4>
        <p id="statusSub" class="mb-0 opacity-75 small">Đang đối soát chữ ký số từ VNPAY...</p>
      </div>

      <div class="p-4">
        <!-- Thông tin hóa đơn chi tiết -->
        <div class="border rounded-3 p-3 bg-light mb-4">
          <div class="d-flex justify-content-between py-2 border-bottom">
            <span class="text-muted small">Mã hóa đơn:</span>
            <span class="fw-bold" id="resOrderId">-</span>
          </div>
          <div class="d-flex justify-content-between py-2 border-bottom">
            <span class="text-muted small">Mã giao dịch VNPAY:</span>
            <span class="fw-bold" id="resTxnNo">-</span>
          </div>
          <div class="d-flex justify-content-between py-2 border-bottom">
            <span class="text-muted small">Ngân hàng thanh toán:</span>
            <span class="fw-bold" id="resBank">-</span>
          </div>
          <div class="d-flex justify-content-between py-2 border-bottom">
            <span class="text-muted small">Số tiền thanh toán:</span>
            <span class="fw-bold text-primary fs-5" id="resAmount">-</span>
          </div>
          <div class="d-flex justify-content-between py-2">
            <span class="text-muted small">Chữ ký bảo mật (Checksum):</span>
            <span class="badge bg-secondary" id="resHash">Đang xác thực...</span>
          </div>
        </div>

        <div class="d-grid gap-2">
          <a href="/" class="btn btn-primary py-2 fw-semibold">
            <i class="fa-solid fa-arrow-left me-2"></i> Quay lại cửa hàng
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const responseCode = params.get("vnp_ResponseCode");
    const orderId = params.get("vnp_TxnRef") || "N/A";
    const txnNo = params.get("vnp_TransactionNo") || "N/A";
    const bank = params.get("vnp_BankCode") || "N/A";
    const rawAmount = params.get("vnp_Amount");

    document.getElementById("resOrderId").innerText = orderId;
    document.getElementById("resTxnNo").innerText = txnNo;
    document.getElementById("resBank").innerText = bank;
    document.getElementById("resAmount").innerText = rawAmount 
      ? (Number(rawAmount) / 100).toLocaleString("vi-VN") + " VNĐ" 
      : "0 VNĐ";

    const banner = document.getElementById("statusBanner");
    const icon = document.getElementById("statusIcon");
    const title = document.getElementById("statusTitle");
    const sub = document.getElementById("statusSub");
    const resHash = document.getElementById("resHash");

    // Xác thực chữ ký số bảo mật từ backend
    fetch(`/api/payment/verify?${params.toString()}`)
      .then(res => res.json())
      .then(data => {
        if (data.is_valid) {
          resHash.className = "badge bg-success";
          resHash.innerText = "Hợp lệ (HMAC-SHA512 OK)";

          if (responseCode === "00") {
            banner.className = "p-4 text-center text-white bg-success";
            icon.className = "fa-solid fa-check";
            title.innerText = "Thanh Toán Thành Công!";
            sub.innerText = "Đơn hàng của bạn đã được ghi nhận vào hệ thống.";
          } else {
            banner.className = "p-4 text-center text-white bg-warning text-dark";
            icon.className = "fa-solid fa-triangle-exclamation";
            title.innerText = "Giao Dịch Đã Bị Hủy";
            sub.innerText = `Mã lỗi VNPAY: ${responseCode}`;
          }
        } else {
          resHash.className = "badge bg-danger";
          resHash.innerText = "Sai lệch (Bị chỉnh sửa)";
          banner.className = "p-4 text-center text-white bg-danger";
          icon.className = "fa-solid fa-circle-xmark";
          title.innerText = "Cảnh Báo: Chữ Ký Không Hợp Lệ!";
          sub.innerText = "Dữ liệu giao dịch có dấu hiệu bị can thiệp trái phép.";
        }
      })
      .catch(() => {
        resHash.className = "badge bg-danger";
        resHash.innerText = "Lỗi kết nối";
      });
  </script>
</body>
</html>
