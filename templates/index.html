<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán đơn hàng - VNStore</title>
  <!-- Bootstrap 5 & FontAwesome Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .checkout-card { border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; }
    .vnpay-btn {
      background: linear-gradient(135deg, #005baa, #0084ff);
      border: none;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
    }
    .vnpay-btn:hover { background: linear-gradient(135deg, #004b8d, #0073e6); }
    .payment-option-card {
      border: 1.5px solid #005baa;
      background-color: #f0f7ff;
      border-radius: 8px;
    }
  </style>
</head>
<body class="py-4">

  <!-- Header Store -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container" style="max-width: 900px;">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="#">
        <i class="fa-solid fa-bag-shopping"></i> VNStore
      </a>
    </div>
  </nav>

  <div class="container" style="max-width: 900px;">
    <div class="row g-4">
      
      <!-- Cột trái: Thông tin nhận hàng & Phương thức thanh toán -->
      <div class="col-md-7">
        <div class="checkout-card p-4 shadow-sm mb-4">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-location-dot text-primary me-2"></i>Thông tin nhận hàng</h5>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small text-muted">Họ và tên</label>
              <input type="text" class="form-control" value="Nguyễn Văn A" readonly>
            </div>
            <div class="col-6">
              <label class="form-label small text-muted">Số điện thoại</label>
              <input type="text" class="form-control" value="0912 345 678" readonly>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label small text-muted">Địa chỉ nhận hàng</label>
            <input type="text" class="form-control" value="Khu dân cư Him Lam, Quận 7, TP. Hồ Chí Minh" readonly>
          </div>
        </div>

        <div class="checkout-card p-4 shadow-sm">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-credit-card text-primary me-2"></i>Phương thức thanh toán</h5>
          
          <div class="payment-option-card p-3 mb-3 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <input class="form-check-input mt-0" type="radio" checked>
              <div>
                <div class="fw-bold text-dark">Cổng thanh toán điện tử VNPAY</div>
                <small class="text-muted">Hỗ trợ quét VNPAY-QR, Thẻ ATM Nội địa & Thẻ Quốc tế</small>
              </div>
            </div>
            <img src="https://sandbox.vnpayment.vn/paymentv2/images/icons/icon-vnpay.svg" alt="VNPAY" height="32" onerror="this.src='https://vnpay.vn/assets/images/logo-vnpay.svg'">
          </div>

          <form id="paymentForm">
            <input type="hidden" id="order_id">
            <input type="hidden" id="order_desc" value="Thanh toan don hang VNStore">
            <input type="hidden" id="amount" value="50000">

            <div class="mb-3">
              <label class="form-label small fw-bold">Chọn kênh thanh toán ưu tiên</label>
              <select class="form-select" id="bank_code">
                <option value="NCB">Ngân hàng Quốc Dân (Thẻ ATM NCB)</option>
                <option value="">Cổng VNPAY (Tự chọn thẻ / mã QR trên cổng)</option>
              </select>
            </div>

            <button type="submit" class="btn vnpay-btn text-white w-100 py-3 shadow-sm" id="submitBtn">
              <i class="fa-solid fa-shield-halved me-2"></i> Tiến hành thanh toán
            </button>
          </form>
        </div>
      </div>

      <!-- Cột phải: Tóm tắt đơn hàng -->
      <div class="col-md-5">
        <div class="checkout-card p-4 shadow-sm">
          <h5 class="fw-bold mb-3">Tóm tắt đơn hàng</h5>
          
          <div class="py-2 border-bottom text-muted small">
            <div class="d-flex justify-content-between py-1">
              <span>Tạm tính</span>
              <span class="text-dark fw-semibold">50.000 đ</span>
            </div>
            <div class="d-flex justify-content-between py-1">
              <span>Phí vận chuyển</span>
              <span class="text-success fw-bold">Miễn phí</span>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center pt-3 mb-2">
            <span class="fs-6 fw-bold">Tổng thanh toán</span>
            <span class="fs-4 fw-bold text-danger">50.000 đ</span>
          </div>
          <small class="text-muted d-block text-end">(Đã bao gồm VAT)</small>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Sinh mã đơn hàng chuẩn format thương mại điện tử
    const randomSuffix = Math.floor(100000 + Math.random() * 900000);
    document.getElementById("order_id").value = "HD" + Date.now().toString().slice(-6) + randomSuffix;

    document.getElementById("paymentForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang kết nối tới cổng thanh toán...';

      const payload = {
        order_id: document.getElementById("order_id").value,
        amount: Number(document.getElementById("amount").value),
        order_desc: document.getElementById("order_desc").value,
        bank_code: document.getElementById("bank_code").value
      };

      try {
        const res = await fetch("/api/payment/create-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.payment_url) {
          window.location.href = data.payment_url;
        } else {
          alert("Lỗi tạo yêu cầu thanh toán: " + (data.detail || "Không xác định"));
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-shield-halved me-2"></i> Tiến hành thanh toán';
        }
      } catch (err) {
        alert("Lỗi kết nối máy chủ: " + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-shield-halved me-2"></i> Tiến hành thanh toán';
      }
    });
  </script>
</body>
</html>
